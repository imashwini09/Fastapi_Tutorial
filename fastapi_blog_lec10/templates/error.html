<!-- Error Page Template -->
<!-- Error display page for handling authorization and validation errors -->
<!-- Features: Error message display, authorization error handling, user feedback -->

{% extends "layout.html" %}
{% block content %}
    <article class="content-section py-3 px-4 mb-4">
        <h1>
            <a class="article-title" href="#">Oops... {{ status_code }} Error</a>
        </h1>
        <p class="article-content">{{ message }}</p>
    </article>
{% endblock content %}
